---
- name: Deploy Rancher on RKE2
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Install Helm
      ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Apply cert-manager CRDs
      ansible.builtin.command: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.12.17/cert-manager.crds.yaml
      changed_when: true

    - name: Add Helm repos
      ansible.builtin.shell: |
        helm repo add jetstack https://charts.jetstack.io
        helm repo add rancher-latest https://releases.rancher.com/server-charts/latest
        helm repo update
      changed_when: true

    - name: Install cert-manager
      ansible.builtin.command: >
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace
      changed_when: true

    - name: Wait for cert-manager
      ansible.builtin.command: kubectl wait --namespace cert-manager --for=condition=ready pod -l app.kubernetes.io/instance=cert-manager --timeout=120s
      changed_when: false

    - name: Install Rancher
      ansible.builtin.command: >
        helm upgrade --install rancher rancher-latest/rancher
        --namespace cattle-system --create-namespace
        --set hostname={{ rancher_hostname }}
        --set bootstrapPassword={{ rancher_bootstrap_password }}
        --set ingress.ingressClassName=nginx
        --set ingress.tls.source=rancher
      changed_when: true

    - name: Patch CoreDNS for Rancher
      ansible.builtin.shell: |
        kubectl get configmap -n kube-system rke2-coredns-rke2-coredns -o yaml > /tmp/coredns-cm.yaml
        if ! grep -q "{{ rancher_hostname }}" /tmp/coredns-cm.yaml; then
          sed -i '/\.:53 {/a \        hosts {\n            '"{{ metallb_vip }}"' '"{{ rancher_hostname }}"'\n            fallthrough\n        }' /tmp/coredns-cm.yaml
          kubectl apply -f /tmp/coredns-cm.yaml
          kubectl -n kube-system rollout restart deployment rke2-coredns-rke2-coredns
        fi
      changed_when: true
