---
# 1. OS下準備
- name: Prepare OS for RKE2
  hosts: all
  become: true
  tasks:
    - import_role:
        name: rke2
        tasks_from: os_prep.yml

# 2. cp1 初期化
- name: Initialize First Control Plane
  hosts: cp[0]
  become: true
  tasks:
    - import_role:
        name: rke2
        tasks_from: cp_init.yml

# 3. cp2, cp3 参加
- name: Join Remaining Control Planes
  hosts: cp[1:]
  become: true
  tasks:
    - import_role:
        name: rke2
        tasks_from: cp_join.yml

# 4. worker 参加
- name: Join Workers
  hosts: worker
  become: true
  tasks:
    - import_role:
        name: rke2
        tasks_from: worker_join.yml