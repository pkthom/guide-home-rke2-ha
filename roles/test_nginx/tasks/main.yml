---
- name: Apply namespace test
  ansible.builtin.shell: kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true
- name: Configure Nginx & Ingress
  ansible.builtin.copy:
    dest: /tmp/test-nginx.yaml
    content: "{{ nginx_manifests | to_nice_yaml }}"
  vars:
    nginx_manifests:
      apiVersion: v1
      kind: List
      items:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-nginx
            namespace: test
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-nginx
            template:
              metadata:
                labels:
                  app: test-nginx
              spec:
                containers:
                  - name: nginx
                    image: nginx:alpine
                    ports:
                      - containerPort: 80
        - apiVersion: v1
          kind: Service
          metadata:
            name: test-nginx
            namespace: test
          spec:
            selector:
              app: test-nginx
            ports:
              - port: 80
                targetPort: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: test-nginx-ingress
            namespace: test
          spec:
            ingressClassName: nginx
            rules:
              - host: chart-example.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: test-nginx
                          port:
                            number: 80
- name: Apply Nginx manifests
  ansible.builtin.command: kubectl apply -f /tmp/test-nginx.yaml
  changed_when: true
