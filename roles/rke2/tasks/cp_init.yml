---
- name: Create config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'

- name: Configure cp1
  ansible.builtin.copy:
    dest: /etc/rancher/rke2/config.yaml
    content: |
      token: "{{ rke2_token }}"
      tls-san:
      {% for san in tls_sans %}
        - "{{ san }}"
      {% endfor %}
      node-taint:
        - "node-role.kubernetes.io/control-plane:NoSchedule"

- name: Install & Start RKE2 Server
  ansible.builtin.shell: curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION="{{ rke2_version }}" sh -
  args:
    creates: /usr/local/bin/rke2

- name: Enable rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    state: started
    enabled: true
  register: rke2_server_start
  retries: 5
  delay: 5
  until: rke2_server_start is succeeded

- name: Wait for kubeconfig on first control plane
  ansible.builtin.wait_for:
    path: /etc/rancher/rke2/rke2.yaml
    timeout: 300

- name: Ensure controller kubeconfig directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Fetch kubeconfig to controller
  ansible.builtin.fetch:
    src: /etc/rancher/rke2/rke2.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true

- name: Point kubeconfig at first control plane API
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: '127\.0\.0\.1'
    replace: "{{ ansible_host }}"
  delegate_to: localhost
  become: false

- name: Restrict kubeconfig permissions
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: '0600'
  delegate_to: localhost
  become: false
